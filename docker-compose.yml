name: inventory-engine
services:
  app:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    image: inventory-engine-php:8.1
    restart: unless-stopped
    environment:
      - APP_ENV=development
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=inventory_engine
      - DB_USER=root
      - DB_PASSWORD=secret
      - TEST_DB_DSN=mysql:host=mariadb;port=3306;dbname=inventory_engine;charset=utf8mb4
      - TEST_DB_USER=root
      - TEST_DB_PASS=secret
    volumes:
      - ./:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - app-network

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=secret
      - MARIADB_DATABASE=inventory_engine
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app-network

  web:
    image: nginx:stable
    ports:
      - "7007:80"
    volumes:
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www/html:ro
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:
